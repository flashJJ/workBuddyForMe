appId: com.wbfm.desktop
productName: WorkBuddyForMe
copyright: Copyright © 2025 WorkBuddy For Me

directories:
  output: release
  buildResources: build

# 仅打入编译后的主进程/preload；standalone 服务走 extraResources（原生 .node 不能进 asar）
# electron-updater 作为 production 依赖由 electron-builder 自动归集进 asar 的 node_modules
files:
  - dist/**/*
  - package.json
  - "!**/*.map"

# 自动更新：electron-updater 从 app-update.yml 读取 GitHub 仓库信息
# （electron-builder 构建时生成 app-update.yml）
publish:
  provider: github
  owner: flashJJ
  repo: workBuddyForMe


extraResources:
  - from: resources/server
    to: server
    filter:
      - "**/*"

asar: true
asarUnpack:
  - "**/*.node"

win:
  # 本地/CI 构建无代码签名证书：关闭签名与 rcedit，避免 signApp 阶段失败
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WorkBuddyForMe

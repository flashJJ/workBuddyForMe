name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm（读取 packageManager 字段）
        uses: pnpm/action-setup@v4

      - name: 安装 Node（读取 .nvmrc）
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      - name: 质量门禁（typecheck + lint + 300 行约束）
        run: pnpm check
        timeout-minutes: 15

      - name: RAG 基线评测（Promptfoo mock provider，8 个 fixture）
        run: pnpm eval:rag
        timeout-minutes: 10
        env:
          PROMPTFOO_DISABLE_TELEMETRY: "1"

      - name: 单元测试（覆盖率分级门禁：core 70%+压缩模块 95%、web 关键域 60%）
        run: pnpm test:unit
        timeout-minutes: 25

      - name: API 集成测试
        run: pnpm test:integration
        timeout-minutes: 10

      - name: 构建 Web（next build，供 E2E playwright 用 next start 启动）
        run: pnpm build:web 2>&1 | tee build-web.log
        timeout-minutes: 15

      - name: 构建告警门禁（Attempted import error 即失败）
        timeout-minutes: 5
        run: |
          if grep -n "Attempted import error" build-web.log; then
            echo "::error::构建日志出现 Attempted import error，检查包 exports 与 barrel 聚合"
            exit 1
          fi

      - name: 包导出冒烟（生产条件子路径符号）
        run: pnpm check:exports
        timeout-minutes: 5

      # E2E 与视觉放在长链路验收之前：即使验收卡住，界面产物也已生成
      - name: 缓存 Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: 安装 Playwright Chromium 并执行 Web 关键路径 E2E
        # 140+ 用例串行 + serial 组整组重试；stage/VRM 软件渲染单组约 6 分钟。
        # 35 分钟会砍掉尾部用例，留足 70 分钟覆盖「全量 + 两组重试」的最坏情况
        timeout-minutes: 70
        run: |
          pnpm --filter @wbfm/web exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: 视觉巡检 L1（首月非阻断）
        continue-on-error: true
        timeout-minutes: 10
        run: pnpm test:e2e:visual
        env:
          WBFM_VISUAL: "1"

      - name: 上传视觉巡检差异
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            tests/e2e/visual-v415.spec.ts-snapshots
            apps/web/test-results
          if-no-files-found: ignore

      - name: E2E 失败用例摘要（写入 Job Summary + 文件注解）
        if: failure()
        timeout-minutes: 2
        run: node scripts/e2e/summarize-failures.mjs

      - name: 上传 E2E 产物（失败时留存 trace/screenshot/报告/junit）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore

      - name: 自动验收（Fake Web + 场景化 mock，离线全链路）
        run: pnpm eval:acceptance
        timeout-minutes: 20
        env:
          WBFM_ACCEPTANCE_PORT: "42341"

      - name: 工具链路评测（promptfoo + 场景化 mock）
        run: pnpm eval:tools
        timeout-minutes: 15
        env:
          WBFM_TOOL_EVAL_PORT: "42342"

      - name: 多智能体协作回归（eval:agent，自动起 mock 服务）
        run: pnpm eval:agent:server
        timeout-minutes: 15
        env:
          WBFM_EVAL_PORT: "42340"

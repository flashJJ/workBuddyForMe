name: Release

# 两种触发：
# - 推送 v* 标签：构建并发布 GitHub **draft** Release（人工核对后转正式）
# - 手动 workflow_dispatch：只构建并上传 workflow artifact，不发布（取包测试用）
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# electron-builder --publish onTag 需要经内置 GITHUB_TOKEN 创建 GitHub Release
# 并上传安装包资产；新仓库默认 token 为只读，不显式授予会在发布步 403
# （Resource not accessible by integration）。仅本发布流水线需要写权限。
permissions:
  contents: write

jobs:
  windows:
    name: Windows NSIS 安装包
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node（读取 .nvmrc）
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 版本一致性校验（标签必须等于 root package.json version）
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "v${PKG_VER}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json v${PKG_VER} 不一致"
            exit 1
          fi
          echo "tag/version: ${GITHUB_REF_NAME}"

      - name: 版本真源同步校验（sync-version --check）
        run: pnpm sync-version:check

      # 标签可能打在未过 CI 的提交上；发布前补齐全量门禁，避免脏提交直接出包
      - name: 质量门禁（typecheck + lint + 行数/结构/环/ASCII）
        run: pnpm check

      - name: 单元测试（Windows 份，顺带验证原生依赖）
        # 慢机并行跑 8 个包的 vitest 会互相抢 CPU，导致与断言无关的超时误报；
        # 并发压到 2，配合各包 testTimeout=20s，优先保证结果可信。
        run: pnpm test:unit -- --concurrency=2

      - name: 构建 Web standalone
        run: pnpm build:web

      - name: 构建桌面壳主进程/preload
        run: pnpm --filter @wbfm/desktop build

      - name: 归集 standalone 服务产物
        run: node apps/desktop/scripts/prepare-server.mjs

      - name: electron-builder 打包（有签名凭据则签名，无则跳过签名保留 rcedit）
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 证书购买后在仓库 Secrets 配置：CSC_LINK（base64 编码的 pfx）与 CSC_KEY_PASSWORD
          # 未配置时 electron-builder 自动跳过 signtool（cscInfo=null），不影响构建
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        # 必须用 pnpm exec：npx 会把 npm_config_user_agent 标成 npm，electron-builder 在
        # 各目录都找不到 lockfile 时回退环境探测，误判为 npm collector；pnpm hoisted 布局的
        # 生产依赖在根 node_modules，只扫 apps/desktop 会漏收（v2.22.0 即因此缺
        # @nut-tree-fork/nut-js 启动崩溃）。
        run: pnpm exec electron-builder --win --x64 --publish onTag

      - name: 产物自检（版本资源/图标；配置了证书时同时校验签名链）
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          $exe = Get-ChildItem apps/desktop/release/win-unpacked/*.exe | Where-Object { $_.Name -notlike 'Uninstall*' } | Select-Object -First 1
          & apps/desktop/scripts/verify-artifacts.ps1 -Exe $exe.FullName -RequireSignature:([bool]$env:CSC_LINK)

      - name: 上传安装包与更新元数据（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: wbfm-setup-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error

      # electron-builder 的 --publish onTag 先建草稿再自检：自检或后续步骤失败时，
      # 起草稿仍会留在 Release 列表里，容易被人直接转正式。失败即清掉草稿（保留 tag）。
      - name: 失败时清理草稿 Release（避免坏包被误转正式）
        if: failure() && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${GITHUB_REF_NAME}" --yes || true
